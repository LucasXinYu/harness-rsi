name: Validate literature collection
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/catalog.py check
      - run: node --check docs/app.js
      - run: node --check docs/observatory.js
      - run: node --input-type=module --check < docs/benchmarks.js
      - run: node tests/evidence_model_test.mjs
