<g fill="#b6a5ff"><circle cx="181" cy="283" r="3"/><circle cx="414" cy="176" r="3"/></g>
<path d="M192 52H228M192 52V70M387 365H353M387 365V347" stroke="#6edccc" stroke-opacity=".5"/>
